<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>SelfOS Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070a;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(45, 212, 191, 0.12), transparent 34rem),
          #05070a;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.92);
        padding: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        margin: 12px 0 0;
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SelfOS is offline</h1>
      <p>Your private dashboard data is not cached offline. Reconnect to load the latest modules and logs.</p>
    </main>
  </body>
</html>
